<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ReSoK Members' Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --page: #fbfbfc;
      --card: #ffffff;
      --panel: #f6f7f9;
      --field: #f3f4f7;
      --text: #7d8091;
      --heading: #1d2030;
      --line: #d9dde8;
      --button: #058348;
      --button-hover: #e70e0e;
      --danger: #d92d20;
      --success: #0f7a38;
      --shadow: 0 18px 50px rgba(19, 29, 54, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: var(--page);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .login-shell {
      width: min(430px, calc(100vw - 32px));
      padding: 26px 28px 32px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .login-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 230px;
      margin-bottom: 30px;
      padding: 28px 22px;
      border-radius: 18px;
      background: var(--panel);
    }

    .login-logo img {
      height: 116px;
      max-width: 100%;
      object-fit: contain;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .alert {
      display: none;
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.35;
      background: #f8fafc;
      border: 1px solid #e5e7ef;
    }

    .alert.show { display: block; }
    .alert.error { color: #9f071d; }
    .alert.success { color: var(--success); }

    .field {
      display: grid;
      gap: 0;
      margin-bottom: 24px;
    }

    .input-wrap {
      min-height: 50px;
      display: flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--field);
      padding: 0 16px 0 18px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #4e5366;
      font-size: 1rem;
      font-weight: 500;
    }

    input::placeholder { color: #9aa1b7; font-weight: 500; }

    .password-toggle {
      border: 0;
      background: transparent;
      color: #7e8497;
      cursor: pointer;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin: -6px 0 26px;
      font-size: 0.9rem;
    }

    a {
      color: #0ea5d7;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover { color: #0b86af; }

    .login-btn {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      background: var(--button);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(18, 183, 106, 0.2);
      transition: background .2s ease, transform .2s ease;
    }

    .login-btn:hover {
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      cursor: wait;
      transform: none;
      opacity: .78;
    }

    @media (max-width: 460px) {
      body { padding: 12px; background: var(--page); }
      .login-shell {
        width: min(100%, 430px);
        padding: 20px 18px 24px;
        border-radius: 18px;
      }
      .login-logo {
        min-height: 190px;
        padding: 22px 16px;
        margin-bottom: 24px;
      }
      .login-logo img { height: 96px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="login-shell" aria-labelledby="loginTitle">
      <a class="login-logo" href="../../" aria-label="ReSoK Home">
        <img src="assets/img/logo.png" alt="Respiratory Society of Kenya logo" />
      </a>
      <h1 id="loginTitle" class="sr-only">Login to your account</h1>

      <div id="loginAlert" class="alert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="sr-only" for="loginEmail">Username or Email</label>
          <div class="input-wrap">
            <input id="loginEmail" name="email" type="email" placeholder="Username or Email" autocomplete="username" required />
          </div>
        </div>

        <div class="field">
          <label class="sr-only" for="loginPassword">Password</label>
          <div class="input-wrap">
            <input id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
            <button type="button" id="passwordToggle" class="password-toggle" aria-label="Show password">
              <i class="far fa-eye-slash"></i>
            </button>
          </div>
        </div>

        <div class="forgot-row">
          <a href="forgot-password">Forgot Password?</a>
        </div>

        <button id="loginBtn" class="login-btn" type="submit">Login</button>
      </form>
    </section>
  </main>

  <script src="js/portal-state.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("loginEmail");
    const passwordInput = document.getElementById("loginPassword");
    const passwordToggle = document.getElementById("passwordToggle");
    const loginBtn = document.getElementById("loginBtn");
    const alertBox = document.getElementById("loginAlert");

    function showAlert(message, type = "error") {
      alertBox.textContent = message;
      alertBox.className = `alert show ${type}`;
    }

    function clearAlert() {
      alertBox.textContent = "";
      alertBox.className = "alert";
    }

    /**
     * Where to send the member after login. The members-only gate on the main site
     * (member-gate.php) bounces here with ?next=/learning so they land back on the page
     * they asked for. Only a plain same-site path is accepted - anything that could point
     * off-site ("//evil.com", "https://...", a backslash Windows browsers normalise to
     * "/") is discarded, so this can't be turned into an open redirect in a phishing link.
     */
    // Arriving from an inactivity logout - either the browser timer in portal-state.js or
    // the gate on /learning. Without a word here, being bounced back to login just looks
    // like the session broke.
    if (new URLSearchParams(window.location.search).get("timeout") === "1") {
      showAlert("You were signed out after 20 minutes of inactivity. Please log in again.");
    }

    function safeNextPath() {
      const raw = new URLSearchParams(window.location.search).get("next") || "";
      if (!raw.startsWith("/") || raw.startsWith("//") || raw.includes("\\") || raw.includes(":")) return "";
      return raw;
    }

    passwordToggle.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      passwordToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      passwordToggle.innerHTML = `<i class="far ${show ? "fa-eye" : "fa-eye-slash"}"></i>`;
      passwordInput.focus();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearAlert();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showAlert("Please enter both your email address and password.");
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showAlert("Please enter a valid email address.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        const response = await fetch("api/index.php?route=auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        let data = {};
        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) throw new Error(data.error || "Invalid email or password.");

        window.ResokPortal.login(email, data.user, data.token);
        const isAdmin = data.user?.role === "admin";
        const next = safeNextPath();
        const destination = isAdmin ? "admin-review" : next || "dashboard";
        showAlert(
          next && !isAdmin
            ? "Login successful. Taking you back..."
            : `Login successful. Redirecting to your ${isAdmin ? "admin portal" : "dashboard"}...`,
          "success"
        );
        setTimeout(() => {
          window.location.href = destination;
        }, 650);
      } catch (error) {
        showAlert(error.message || "We could not complete your login. Please try again.");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
