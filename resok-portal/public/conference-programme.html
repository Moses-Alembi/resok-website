<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conference Programme - ReSoK</title>
  <style>
    :root{--green:#087539;--red:#bc0b22;--ink:#16202c;--muted:#667085;--line:#e4e7ec;--bg:#f5f7fa}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
    [hidden]{display:none!important}
    header{background:#fff;border-bottom:1px solid #eee}
    .wrap{max-width:900px;margin:0 auto;padding:0 16px}
    header .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
    header img{height:34px}
    .hero{background:var(--green);color:#fff;padding:22px 0}
    .hero h1{font-size:22px;line-height:1.25}
    .hero p{opacity:.9;font-size:14px;margin-top:4px}
    .preview{background:#fff8e6;color:#93370d;font-size:13px;text-align:center;padding:7px 12px}
    nav.days{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px}
    nav.days button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--ink)}
    nav.days button[aria-selected=true]{background:var(--green);border-color:var(--green);color:#fff}
    main{padding:10px 0 50px}
    .session{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(16,24,40,.05);padding:14px 16px;margin:12px 0;border-left:4px solid var(--green);display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
    .session.break{background:transparent;box-shadow:none;border-left-color:#d0d5dd}
    .session.poster{border-left-color:#7a3db8} .session.workshop{border-left-color:#b54708} .session.plenary{border-left-color:var(--red)}
    .time{font-weight:700;font-variant-numeric:tabular-nums}
    .time small{display:block;font-weight:400;color:var(--muted)}
    .kind{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
    h2{font-size:16.5px;line-height:1.3}
    .meta{font-size:13px;color:var(--muted)}
    .desc{font-size:14px;margin-top:4px}
    ul{list-style:none;margin-top:8px}
    li{padding:6px 0;border-top:1px dashed var(--line);font-size:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
    li .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:44px}
    li .who{color:var(--muted);font-size:13px}
    .empty{background:#fff;border-radius:12px;padding:26px;margin-top:20px;text-align:center;color:var(--muted)}
    @media (max-width:560px){.session{grid-template-columns:1fr;gap:4px}}
  </style>
</head>
<body>
  <header><div class="wrap"><a href="../../index.html"><img src="assets/img/logo.png" alt="ReSoK"></a></div></header>
  <div class="hero"><div class="wrap"><h1 id="name">Conference programme</h1><p id="sub"></p></div></div>
  <div class="preview" id="preview" hidden>Preview: delegates cannot see this programme until it is published.</div>
  <div class="wrap">
    <nav class="days" id="dayNav" role="tablist" aria-label="Days"></nav>
    <main id="main"><div class="empty">Loading&hellip;</div></main>
  </div>
  <script src="js/portal-state.js?v=20261017-proof"></script>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const day = (d, opts) => new Date(d + 'T00:00').toLocaleDateString('en-GB', opts);
    let data = null;

    function show(d) {
      document.querySelectorAll('#dayNav button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.day === d.day)));
      $('main').innerHTML = d.sessions.map((s) => `<article class="session ${esc(s.kind)}">
        <div class="time">${esc(s.startsAt)}<small>to ${esc(s.endsAt)}</small></div>
        <div><div class="kind">${esc(s.kindLabel)}${s.room ? ' · ' + esc(s.room) : ''}</div><h2>${esc(s.title)}</h2>
          ${s.chairs ? `<div class="meta">Chairs: ${esc(s.chairs)}</div>` : ''}${s.description ? `<div class="desc">${esc(s.description)}</div>` : ''}
          ${s.items.length ? `<ul>${s.items.map((i) => `<li><span class="t">${i.board ? 'Board ' + esc(i.board) : esc(i.startsAt || '')}</span>
            <span>${esc(i.title)}${i.speaker ? `<div class="who">${esc(i.speaker)}${i.affiliation ? ', ' + esc(i.affiliation) : ''}</div>` : ''}</span></li>`).join('')}</ul>` : ''}
        </div></article>`).join('');
    }

    window.ResokPortal.api('conference/programme').then((r) => {
      data = r;
      $('name').textContent = r.event.name;
      $('sub').textContent = r.event.venue ? r.event.venue : '';
      $('preview').hidden = !r.preview;
      if (!r.days.length) {
        $('main').innerHTML = `<div class="empty">${r.published ? 'The programme is being prepared.' : 'The programme will be published here once it is final.'}</div>`;
        return;
      }
      $('dayNav').innerHTML = r.days.map((d, i) => `<button role="tab" data-day="${d.day}">Day ${i + 1} · ${esc(day(d.day, { weekday: 'short', day: 'numeric', month: 'short' }))}</button>`).join('');
      document.querySelectorAll('#dayNav button').forEach((b) => b.onclick = () => show(r.days.find((d) => d.day === b.dataset.day)));
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Nairobi' }).format(new Date());
      show(r.days.find((d) => d.day === today) || r.days[0]);
    }).catch((e) => { $('main').innerHTML = `<div class="empty">${esc(e.status === 404 ? 'There is no conference programme at the moment.' : e.message)}</div>`; });
  })();
  </script>
</body>
</html>
