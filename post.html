  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand-primary: #00932e;
      --brand-secondary: #bc0b22;
      --text-dark: #2c3e50;
      --bg-light: #f5f7fa;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --heading-font: 'Mulish', 'Poppins', sans-serif;
    }
    body {
      font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text-dark);
      background: linear-gradient(135deg, var(--bg-light) 0%, #e4edf9 100%);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
    }
    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      font-family: var(--heading-font);
      font-weight: 900;
    }
    .brand img { width: 42px; height: 42px; object-fit: contain; }

    .navlinks {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }
    .navlinks a {
      text-decoration: none;
      font-weight: 800;
      color: rgba(44, 62, 80, 0.9);
      padding: 8px 10px;
      border-radius: 999px;
    }
    .navlinks a:hover {
      background: rgba(0, 147, 46, 0.10);
    }
    .navlinks a.cta {
      background: linear-gradient(135deg, rgba(0, 147, 46, 0.16), rgba(188, 11, 34, 0.14));
      border: 1px solid rgba(0, 0, 0, 0.10);
    }

    .hero {
      padding: 54px 18px 18px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      background:
        radial-gradient(1000px 420px at 10% 0%, rgba(0, 147, 46, 0.18), transparent 60%),
        radial-gradient(900px 360px at 90% 20%, rgba(188, 11, 34, 0.18), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0.12));
    }
    .hero-inner {
      max-width: 1240px;
      margin: 0 auto;
    }
    .hero h1 {
      font-family: 'Poppins', 'Mulish', sans-serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 1.65rem + 4.2vw, 5rem);
      line-height: 1.12;
      letter-spacing: 0;
      text-transform: uppercase;
      color: #050b12;
      text-shadow: none;
    }
    .hero p {
      margin-top: 10px;
      max-width: 70ch;
      color: rgba(44, 62, 80, 0.85);
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 18px 18px 56px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }
    .card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.09);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .cover {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }
    .content {
      padding: 16px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      color: rgba(44, 62, 80, 0.75);
      font-size: 0.92rem;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 147, 46, 0.10);
      border: 1px solid rgba(0, 147, 46, 0.18);
      font-weight: 900;
      color: rgba(10, 46, 56, 0.92);

      border-left: 4px solid var(--brand-secondary);
      background: rgba(188, 11, 34, 0.06);
      color: rgba(44, 62, 80, 0.92);
      font-weight: 700;

      padding: 14px;
    }
    .side h3 {
      font-family: 'Poppins', 'Mulish', sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      margin-bottom: 10px;
    }

    .content > h2,
    .content .body h2,
    .side h3 {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 100%;
      color: #050b12;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: none !important;
      filter: none !important;
      white-space: nowrap;
      overflow: visible;
    }
    .hero h1::before,
    .content > h2::before,
    .content .body h2::before,
    .side h3::before {
      content: "";
      width: 5px;
      height: 0.95em;
      border-radius: 3px;
      background: var(--brand-secondary);
      flex: 0 0 5px;
      box-shadow: none !important;
      filter: none !important;
    }
    .side a {
      display: block;
      text-decoration: none;
      font-weight: 800;
      color: rgba(44, 62, 80, 0.92);
      padding: 10px 10px;
      border-radius: 12px;
    }
    .side a:hover { background: rgba(0, 147, 46, 0.10); }

    @media (max-width: 980px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>

    document.title = `${post.title} | ReSoK Blog`;

    document.getElementById("postSubtitle").textContent = post.subtitle;
    document.getElementById("postHeading").textContent = post.title;

    const img = document.getElementById("postImage");
    img.src = post.image;
    img.alt = post.imageAlt || post.title;

    const cat = document.getElementById("postCategory");
    cat.innerHTML = `<i class="fas ${post.icon}" aria-hidden="true"></i> ${post.category}`;

    document.getElementById("postDate").innerHTML = `<i class="far fa-calendar-alt" aria-hidden="true"></i> ${post.date}`;
    document.getElementById("postAuthor").innerHTML = `<i class="far fa-user" aria-hidden="true"></i> ${post.author}`;

    const body = document.getElementById("postBody");
    body.innerHTML = post.body.map((chunk) => chunk.startsWith("<") ? chunk : `<p>${chunk}</p>`).join("");

    const fitSingleLineHeading = (heading) => {
      if (!heading) return;
      heading.style.fontSize = "";
      const startingSize = parseFloat(window.getComputedStyle(heading).fontSize);
      let size = startingSize;
      const minSize = heading.matches(".hero h1") ? 18 : 18;

      while (heading.scrollWidth > heading.clientWidth && size > minSize) {
        size -= 1;
        heading.style.fontSize = `${size}px`;
      }

      if (heading.scrollWidth > heading.clientWidth) {
        const ratio = heading.clientWidth / heading.scrollWidth;
        heading.style.fontSize = `${Math.max(16, size * ratio)}px`;
      }
    };

    const fitAllHeadings = () => {
      document
        .querySelectorAll(".hero h1, .content > h2, .content .body h2, .side h3")
        .forEach(fitSingleLineHeading);
    };

    fitAllHeadings();
    window.addEventListener("resize", fitAllHeadings);
