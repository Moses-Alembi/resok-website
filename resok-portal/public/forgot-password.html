<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - ReSoK Members' Portal</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .reset-card{max-width:480px;margin:42px auto;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:30px}.reset-card h1{font-size:24px;margin-bottom:8px}.reset-card p{color:#666;margin-bottom:20px}.reset-card label{display:block;font-weight:600;margin-bottom:8px}.reset-card input{width:100%;padding:13px;border:1px solid #ddd;border-radius:6px}.reset-card button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:6px;background:var(--brand-secondary);color:#fff;font-weight:700;cursor:pointer}.reset-card .notice{display:none;margin-top:16px;padding:12px;border-left:4px solid var(--brand-primary);background:#e8f5e9;color:#2e7d32}
  </style>
</head>
<body>
  <div class="brand-header"><div class="brand-wrap"><a href="./"><img src="assets/img/logo.png" alt="ReSoK"></a></div></div>
  <main class="reset-card">
    <h1>Reset Password</h1>
    <p id="resetIntro">Enter your member email and we will queue a password reset link.</p>
    <form id="resetForm">
        <!-- Screening. Positioned off-screen rather than hidden: a person never fills this,
             and a script that posts every field it finds does. The label stays so a screen
             reader can explain what it is skipping. -->
        <div style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden" aria-hidden="true">
          <label for="pf-website">Leave this field empty</label>
          <input id="pf-website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>

      <label for="resetEmail" id="resetLabel">Email Address</label>
      <input id="resetEmail" type="email" required placeholder="your@email.com">
      <button type="submit">Send Reset Link</button>
    </form>
    <div class="notice" id="resetNotice">Password reset email queued. Check your inbox.</div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const resetToken = params.get('token');
    const input = document.getElementById('resetEmail');
    const label = document.getElementById('resetLabel');
    const button = document.querySelector('#resetForm button');
    if (resetToken) {
      document.getElementById('resetIntro').textContent = 'Enter your new password.';
      label.textContent = 'New Password';
      input.type = 'password';
      input.placeholder = 'New password';
      button.textContent = 'Update Password';
    }

    const pageLoadedAt = Date.now();
    document.getElementById('resetForm').addEventListener('submit',async function(e){
      e.preventDefault();
      try {
        const endpoint = resetToken ? 'api/index.php?route=auth/reset-password' : 'api/index.php?route=auth/forgot-password';
        // Only the "send me a link" request is screened - a reset carried out with a valid
        // emailed token has already proved itself, and failing it on dwell time would strand
        // someone mid-reset.
        const trap = document.querySelector('input[name="website"]');
        const body = resetToken
          ? { token: resetToken, password: input.value }
          : { email: input.value, website: trap ? trap.value : '', formLoadedAt: pageLoadedAt };
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) throw new Error(data.error || 'Request failed');
        document.getElementById('resetNotice').textContent = resetToken ? 'Password updated. You can now log in.' : 'Password reset email queued. Check your inbox.';
      } catch (error) {
        document.getElementById('resetNotice').textContent = error.message || 'Could not complete password reset.';
      }
      document.getElementById('resetNotice').style.display='block';
    });
  </script>
</body>
</html>
