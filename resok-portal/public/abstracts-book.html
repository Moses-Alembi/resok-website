<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abstract Book - ReSoK</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{--green:#087539;--ink:#16202c;--muted:#5d6878}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:#eef1f4;line-height:1.5}
    .tools{position:sticky;top:0;background:#fff;border-bottom:1px solid #dde2e8;padding:10px 18px;display:flex;gap:12px;align-items:center;font-family:'Segoe UI',Arial,sans-serif;font-size:14px;z-index:5}
    .tools button{background:var(--green);color:#fff;border:0;border-radius:7px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
    .tools .muted{color:var(--muted)}
    .book{max-width:820px;margin:24px auto;background:#fff;padding:56px 64px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
    .cover{text-align:center;padding:120px 0 140px;border-bottom:3px solid var(--green);margin-bottom:28px}
    .cover img{height:70px;margin-bottom:34px}
    .cover h1{font-size:36px;color:var(--green);line-height:1.15}
    .cover .sub{font-size:20px;margin-top:10px}
    .cover .when{color:var(--muted);margin-top:18px;font-family:'Segoe UI',Arial,sans-serif;font-size:15px}
    .toc h2{font-size:20px;color:var(--green);margin-bottom:10px}
    .toc li{list-style:none;padding:3px 0;font-size:15px;display:flex;gap:8px}
    .toc li span:first-child{flex:1}
    .track{margin-top:40px}
    .track > h2{font-size:24px;color:var(--green);border-bottom:2px solid var(--green);padding-bottom:6px}
    .type{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--muted);margin:22px 0 4px}
    .abs{margin-top:22px;break-inside:avoid-page}
    .abs h3{font-size:17px;line-height:1.3}
    .ref{font-family:'Segoe UI',Arial,sans-serif;font-size:11.5px;color:var(--muted);margin-top:2px}
    .aut{font-size:14px;margin-top:5px}
    .aff{font-size:12.5px;color:var(--muted)}
    .sec{font-size:13.5px;margin-top:5px;text-align:justify}
    .sec b{font-family:'Segoe UI',Arial,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    .kw{font-size:12.5px;color:var(--muted);margin-top:5px}
    figure{margin:10px 0 4px;break-inside:avoid}
    figure img{max-width:100%;max-height:420px;display:block;margin:0 auto}
    figcaption{font-size:12.5px;margin-top:4px}
    sup,sub{font-size:.72em;line-height:0}
    .empty{font-family:'Segoe UI',Arial,sans-serif;color:var(--muted);text-align:center;padding:60px}
    @media print{
      body{background:#fff}
      .tools{display:none}
      .book{box-shadow:none;margin:0;max-width:none;padding:0}
      .cover{page-break-after:always;border:0}
      .toc{page-break-after:always}
      .track{page-break-before:always;margin-top:0}
      @page{margin:18mm 16mm}
    }
  </style>
</head>
<body>
  <div class="tools">
    <button type="button" onclick="window.print()">Print or save as PDF</button>
    <span class="muted">In the print dialogue choose "Save as PDF". Accepted abstracts with released decisions only.</span>
  </div>
  <div class="book" id="book"><div class="empty">Loading&hellip;</div></div>

  <script src="js/portal-state.js?v=20261008-sessions"></script>
  <script src="js/abstract-text.js?v=20261005-phase4"></script>
  <script>
  // The abstract book (ADM-7), laid out for printing. Text is written with textContent only;
  // titles and abstract text get their italics and superscripts from js/abstract-text.js.
  (async () => {
    const make = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
    const box = document.getElementById('book');
    const id = new URLSearchParams(location.search).get('event');
    let book;
    try { book = await window.ResokPortal.api(`abstracts/admin/events/${encodeURIComponent(id)}/book`); }
    catch (error) {
      if (error.status === 401) { location.href = 'login?next=' + encodeURIComponent(location.pathname + location.search); return; }
      box.textContent = ''; box.appendChild(make('div', 'empty', error.message)); return;
    }
    document.title = book.event + ' - Abstract book';
    box.textContent = '';
    const cover = make('div', 'cover');
    const logo = make('img'); logo.src = 'assets/img/logo.png'; logo.alt = 'Respiratory Society of Kenya';
    const dates = [book.startsOn, book.endsOn].filter(Boolean).map((d) => new Date(d + 'T00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }));
    cover.append(logo, make('h1', null, book.event), make('div', 'sub', 'Abstract book'), make('div', 'when', [dates.join(' to '), book.venue].filter(Boolean).join(' · ')));
    box.appendChild(cover);
    if (!book.tracks.length) { box.appendChild(make('div', 'empty', 'No accepted abstracts have been released yet.')); return; }
    const toc = make('div', 'toc');
    toc.appendChild(make('h2', null, 'Contents'));
    book.tracks.forEach((t) => { const li = make('li'); li.append(make('span', null, t.track), make('span', null, t.abstracts.length + ' abstracts')); toc.appendChild(li); });
    box.appendChild(toc);
    book.tracks.forEach((t) => {
      const sec = make('section', 'track');
      sec.appendChild(make('h2', null, t.track));
      let type = null;
      t.abstracts.forEach((a) => {
        if (a.typeLabel !== type) { type = a.typeLabel; sec.appendChild(make('div', 'type', type + 's')); }
        const art = make('article', 'abs');
        art.appendChild(window.AbsText.make('h3', null, a.title));
        art.appendChild(make('div', 'ref', a.reference));
        const affs = [];
        const aut = make('div', 'aut');
        a.authors.forEach((au, i) => {
          let n = affs.indexOf(au.affiliation);
          if (n === -1) { affs.push(au.affiliation); n = affs.length - 1; }
          if (i) aut.appendChild(document.createTextNode(', '));
          aut.appendChild(make(au.presenting ? 'u' : 'span', null, au.name));
          aut.appendChild(make('sup', null, String(n + 1)));
        });
        art.appendChild(aut);
        affs.forEach((f, i) => art.appendChild(make('div', 'aff', `${i + 1} ${f}`)));
        if (a.sections) Object.entries(a.sections).forEach(([h, txt]) => { const p = make('p', 'sec'); p.append(make('b', null, h + ': '), window.AbsText.make('span', null, txt)); art.appendChild(p); });
        else art.appendChild(window.AbsText.make('p', 'sec', a.body));
        (a.figures || []).forEach((f, i) => {
          const fig = make('figure'); const img = make('img'); img.src = f.url; img.alt = 'Figure ' + (i + 1); img.loading = 'lazy';
          const cap = make('figcaption'); cap.append(make('b', null, `Figure ${i + 1}. `), window.AbsText.make('span', null, f.caption)); fig.append(img, cap); art.appendChild(fig);
        });
        if (a.keywords.length) art.appendChild(make('p', 'kw', 'Keywords: ' + a.keywords.join(', ')));
        sec.appendChild(art);
      });
      box.appendChild(sec);
    });
  })();
  </script>
</body>
</html>
