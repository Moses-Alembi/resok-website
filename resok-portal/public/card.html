<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Membership Card - ReSoK Members' Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root{--brand-primary:#00932e;--brand-secondary:#bc0b22;--text-dark:#253141;--muted:#667085;--bg:#f5f7fa;--card:#fff;--line:#e5e7eb;--shadow:0 2px 12px rgba(15,23,42,.07);--radius:8px}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text-dark)}a{text-decoration:none;color:inherit}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.03)}.topbar-inner{max-width:1180px;margin:0 auto;height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:700}.brand img{height:42px}.user-chip{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-primary);color:#fff;display:grid;place-items:center;font-weight:800}
    .layout{max-width:980px;margin:0 auto;padding:28px 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}.panel h1{font-size:24px;margin-bottom:8px}.panel p{color:var(--muted);line-height:1.5}.card-preview{margin-top:20px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}.card-preview svg{display:block;width:100%;height:auto}.empty{margin-top:20px;border:1px dashed #cbd5e1;border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{border:0;border-radius:6px;padding:12px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:var(--brand-primary);color:#fff}.btn-secondary{background:#eef2f7;color:#344054}.btn-danger{background:var(--brand-secondary);color:#fff}.btn:disabled{background:#98a2b3;cursor:not-allowed}@media(max-width:520px){.brand span,.user-name{display:none}.layout{padding:18px 14px}.panel{padding:18px}}
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="topbar-inner">
      <a href="dashboard" class="brand"><img src="assets/img/logo.png" alt="ReSoK" /></a>
      <div class="user-chip"><div class="user-avatar">RM</div><span class="user-name">Member</span></div>
    </div>
  </nav>

  <main class="layout">
    <section class="panel">
      <h1>Membership Card</h1>
      <p id="cardIntro">Your official ReSoK membership card is available once your membership ID has been issued.</p>
      <div id="cardMount"></div>
      <div class="actions">
        <button class="btn btn-primary" id="downloadCard"><i class="fas fa-download"></i> Download Card</button>
        <a class="btn btn-secondary" href="dashboard"><i class="fas fa-home"></i> Dashboard</a>
        <a class="btn btn-secondary" href="financials"><i class="fas fa-file-invoice-dollar"></i> Financials</a>
        <a class="btn btn-danger" href="payment" id="paymentLink"><i class="fas fa-upload"></i> Upload Payment Proof</a>
      </div>
    </section>
  </main>

  <script src="js/portal-state.js?v=membership-background-20260524-gold-bg"></script>
  <script>
    async function renderCard() {
      const member = window.ResokPortal.getState().member;
      window.ResokPortal.hydrateShell();
      const mount = document.getElementById("cardMount");
      if (member.membershipId) {
        const assets = await window.ResokPortal.membershipCardImageAssets(member);
        mount.className = "card-preview";
        mount.innerHTML = window.ResokPortal.membershipCardSvg(member, assets);
        document.getElementById("downloadCard").disabled = false;
        document.getElementById("paymentLink").style.display = "none";
        document.getElementById("cardIntro").textContent = member.profileImageUrl
          ? "Your official ReSoK membership card is ready to download."
          : "Upload your profile photo to complete the card portrait, then download your official ReSoK membership card.";
      } else {
        mount.className = "empty";
        mount.textContent = "No membership card is available yet. Submit payment proof and wait for admin approval to receive your membership ID.";
        document.getElementById("downloadCard").disabled = true;
      }
    }

    document.getElementById("downloadCard").addEventListener("click", async () => {
      try {
        await window.ResokPortal.downloadMembershipCard();
      } catch (error) {
        alert(error.message);
      }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      if (!(await window.ResokPortal.requireAuthForProtectedPage())) return;
      try {
        await window.ResokPortal.refreshFromApi();
      } catch (error) {
        console.warn(error.message || "Could not refresh card.");
      }
      await renderCard();
    });
  </script>
</body>
</html>
